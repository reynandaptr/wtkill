[package]
name = "wtkill"
version = "0.1.0"
edition = "2024"
description = "Find git worktrees under .worktree/ folders, see their size and state, and delete finished ones safely"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reynandaptr/wtkill"
homepage = "https://github.com/reynandaptr/wtkill"
readme = "README.md"
keywords = ["git", "worktree", "tui", "cleanup", "disk-usage"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", ".github/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
